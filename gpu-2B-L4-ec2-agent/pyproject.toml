[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".agents",
    ".aws_creds",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["attr-defined"]
explicit_package_bases = true
exclude = [
    '^.agents/',
]

[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huggingface_hub.*"
ignore_missing_imports = true

# The installed numpy stubs use `type` statements, which need python_version >= 3.12 to parse.
# We target 3.10, so don't descend into them; benchmark_sweep.py is the only importer.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
